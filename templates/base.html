{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Management System</title>

    <!-- Bootstrap CSS and Font Awesome icons (loaded from the internet) -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap">

    <!-- Our own styles -->
    <link rel="stylesheet" href="{% static 'css/main.css' %}">
</head>
<body>

    <!-- Navigation bar -->
    <nav class="navbar navbar-expand navbar-dark">
        <div class="container-fluid">
            <a class="navbar-brand" href="{% url 'index' %}">
                <i class="fa-solid fa-graduation-cap"></i> Student Management System
            </a>
            <ul class="navbar-nav">
                <li class="nav-item">
                    <a class="nav-link" href="{% url 'index' %}"><i class="fa-solid fa-list"></i> All Students</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="{% url 'add' %}"><i class="fa-solid fa-plus"></i> Add Student</a>
                </li>
            </ul>
        </div>
    </nav>

    <!-- Each page puts its own content here -->
    <main class="container-fluid px-4 py-4">
        {% block content %}
        {% endblock %}
    </main>

    <!-- Footer -->
    <footer class="text-center py-4">
        Copyright &copy; 2022 Bob's Programming Academy.
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
