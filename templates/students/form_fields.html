<!-- Shared by add.html and edit.html: shows every field of the form -->
{% for field in form %}
<div class="mb-3">
    <label for="{{ field.id_for_label }}" class="form-label">{{ field.label }}</label>
    {{ field }}
    {% for error in field.errors %}
    <div class="text-danger small">{{ error }}</div>
    {% endfor %}
</div>
{% endfor %}
